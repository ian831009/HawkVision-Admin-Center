<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HawkVision Admin Center</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
    }

    .brand p {
      margin: 6px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .version {
      background: #2563eb;
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .notice {
      background: white;
      border-left: 5px solid #2563eb;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 24px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .card .label {
      font-size: 14px;
      color: #6b7280;
    }

    .card .value {
      margin-top: 10px;
      font-size: 30px;
      font-weight: 800;
    }

    .section {
      margin-top: 28px;
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .placeholder {
      padding: 28px;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      text-align: center;
      color: #64748b;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      padding: 30px 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <h1>HawkVision 管理中心</h1>
    <p>平台帳號、層級、額度與權限管理</p>
  </div>

  <div class="version">
    Admin Center v1.0.0
  </div>
</header>

<main>

  <div class="notice">
    <strong>管理中心建置中</strong><br>
    目前先建立後台首頁與版本識別，下一階段會接入 Supabase 即時資料。
  </div>

  <div class="cards">

    <div class="card">
      <div class="label">平台帳號上限</div>
      <div class="value">100,000</div>
    </div>

    <div class="card">
      <div class="label">目前帳號數</div>
      <div class="value">—</div>
    </div>

    <div class="card">
      <div class="label">已分配額度</div>
      <div class="value">—</div>
    </div>

    <div class="card">
      <div class="label">可分配額度</div>
      <div class="value">—</div>
    </div>

  </div>

  <div class="section">
    <h2>帳號與層級管理</h2>

    <div class="placeholder">
      下一階段將顯示：共同管理員、股東、總代理、代理、子代理、會員。
    </div>
  </div>

  <div class="section">
    <h2>額度管理</h2>

    <div class="placeholder">
      下一階段將接入分配額度、收回未使用額度、已使用額度保護。
    </div>
  </div>

</main>

<footer>
  HawkVision Admin Center · v1.0.0
</footer>

</body>
</html>
