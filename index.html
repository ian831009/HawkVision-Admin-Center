<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HawkVision 管理中心</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: linear-gradient(90deg, #111827, #172554);
      color: white;
      padding: 22px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 { margin: 0; font-size: 26px; }
    header p { margin: 7px 0 0; color: #cbd5e1; font-size: 14px; }

    .version {
      background: #2563eb;
      color: white;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 14px;
      white-space: nowrap;
    }

    main {
      max-width: 1180px;
      margin: 28px auto;
      padding: 0 20px 50px;
    }

    .login-card,
    .section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .login-card {
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    h2 { margin-top: 0; }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .primary { background: #2563eb; color: white; }
    .secondary { background: #e5e7eb; color: #111827; }
    .soft { background: #eef2ff; color: #3730a3; }
    .soft-cyan { background: #ecfeff; color: #155e75; }
    .soft-amber { background: #fffbeb; color: #92400e; }
    .danger-soft { background: #fef2f2; color: #991b1b; }

    .login-card .primary {
      width: 100%;
      margin-top: 18px;
      padding: 12px 18px;
    }

    #dashboard { display: none; }

    .top-user {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .identity-main {
      font-size: 18px;
      font-weight: 700;
    }

    .identity-role {
      margin-left: 8px;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .card .label {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .card .value {
      font-size: 29px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar input {
      max-width: 330px;
    }

    .toolbar-right {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .muted {
      color: #64748b;
      font-size: 13px;
    }

    .create-panel,
    .self-panel,
    .inline-panel {
      border: 1px solid #dbeafe;
      background: #f8fbff;
      border-radius: 12px;
      padding: 16px;
    }

    .create-panel,
    .self-panel {
      display: none;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 0 14px;
    }

    .panel-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .breadcrumb {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
      color: #64748b;
      font-size: 13px;
    }

    .breadcrumb button {
      padding: 5px 8px;
      background: transparent;
      color: #2563eb;
    }

    .context-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .context-title {
      font-weight: 700;
    }

    .child-list {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .child-row {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
      background: white;
    }

    .child-row:last-child {
      border-bottom: 0;
    }

    .child-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .child-title {
      font-weight: 700;
      font-size: 16px;
    }

    .child-account {
      color: #64748b;
      font-size: 13px;
      margin-top: 4px;
    }

    .role-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      vertical-align: middle;
    }

    .role-badge.direct {
      background: #ede9fe;
      color: #6d28d9;
    }

    .child-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .inline-panel {
      margin-top: 12px;
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    .inline-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 0 12px;
    }

    .inline-status,
    .page-status {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      color: #64748b;
      margin-top: 12px;
      display: none;
    }

    .empty {
      padding: 28px;
      color: #64748b;
      text-align: center;
    }

    .reserved-note {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 850px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      header { padding: 18px; }
    }

    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
      .grid,
      .inline-grid { grid-template-columns: 1fr; }
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .child-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>HawkVision 管理中心</h1>
      <p>平台帳號、層級、額度與權限管理</p>
    </div>

    <div class="version">
      Admin Center v1.6.0
    </div>
  </header>

  <main>
    <section id="loginSection" class="login-card">
      <h2>管理員登入</h2>

      <label for="loginAccount">帳號</label>
      <input
        id="loginAccount"
        type="text"
        autocomplete="username"
        placeholder="請輸入帳號"
      />

      <label for="loginPassword">密碼</label>
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="請輸入密碼"
      />

      <button id="loginBtn" class="primary">
        登入管理中心
      </button>

      <div id="loginLoading" class="loading">正在登入…</div>
      <div id="loginError" class="page-status error"></div>
    </section>

    <section id="dashboard">
      <div class="section top-user">
        <div>
          <span id="currentName" class="identity-main">—</span>
          <span id="currentRole" class="identity-role">—</span>
        </div>

        <div class="top-actions">
          <button id="editMyNameBtn" class="soft-cyan" type="button">
            修改我的名稱
          </button>
          <button id="editMyPasswordBtn" class="soft" type="button">
            修改我的密碼
          </button>
          <button id="logoutBtn" class="secondary" type="button">
            登出
          </button>
        </div>
      </div>

      <div id="selfPanel" class="section self-panel"></div>

      <div class="cards">
        <div class="card">
          <div class="label">可管理帳號容量</div>
          <div id="platformMax" class="value">—</div>
        </div>

        <div class="card">
          <div class="label">目前帳號數</div>
          <div id="currentAccounts" class="value">—</div>
        </div>

        <div class="card">
          <div class="label">已分配額度</div>
          <div id="allocatedQuota" class="value">—</div>
        </div>

        <div class="card">
          <div class="label">可分配額度</div>
          <div id="availableQuota" class="value">—</div>
        </div>
      </div>

      <div class="section">
        <div class="toolbar">
          <input
            id="accountSearch"
            type="search"
            placeholder="搜尋名稱或帳號"
          />

          <div class="toolbar-right">
            <span id="accountCount" class="muted">載入中…</span>
            <button id="openCreateBtn" class="primary" type="button">
              ＋ 新增帳號
            </button>
          </div>
        </div>

        <div id="createPanel" class="create-panel">
          <h3 style="margin-top:0;">新增直屬下層</h3>

          <div class="grid">
            <div>
              <label for="newDisplayName">名稱</label>
              <input id="newDisplayName" type="text" autocomplete="off" />
            </div>

            <div>
              <label for="newAccount">帳號</label>
              <input
                id="newAccount"
                type="text"
                autocomplete="off"
                placeholder="例如 wang01"
              />
            </div>

            <div>
              <label for="newPassword">初始密碼</label>
              <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                placeholder="至少 8 個字元"
              />
            </div>

            <div>
              <label for="newRole">商業層級</label>
              <select id="newRole"></select>
            </div>

            <div id="initialQuotaWrap">
              <label for="initialQuota">初始額度</label>
              <input
                id="initialQuota"
                type="number"
                min="0"
                step="1"
                value="0"
              />
            </div>
          </div>

          <div class="panel-actions">
            <button id="cancelCreateBtn" class="secondary" type="button">
              取消
            </button>
            <button id="submitCreateBtn" class="primary" type="button">
              建立帳號
            </button>
          </div>
        </div>

        <div id="pageStatus" class="page-status"></div>

        <div id="breadcrumb" class="breadcrumb"></div>

        <div class="context-line">
          <div>
            <span class="muted">目前查看：</span>
            <span id="contextTitle" class="context-title">—</span>
          </div>

          <button id="backLevelBtn" class="secondary" type="button">
            返回上一層
          </button>
        </div>

        <div id="childList" class="child-list">
          <div class="empty">載入中…</div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://rwxujvpakpemiwkitltk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_aN_1_fzAV3hR6FmW7FTZGg_6SF0MUHF";

    const HAWKVISION_ADMIN_API =
      "https://hawkvision-admin-api.michael19941009.workers.dev";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const ROLE_ORDER = [
      "super_admin",
      "co_admin",
      "shareholder",
      "master_agent",
      "agent",
      "sub_agent",
      "member"
    ];

    const ROLE_LABELS = {
      super_admin: "最高管理員",
      co_admin: "共同管理員",
      shareholder: "股東",
      master_agent: "總代理",
      agent: "代理",
      sub_agent: "子代理",
      member: "會員"
    };

    let currentUser = null;
    let currentAccount = null;
    let currentChildren = [];
    let contextStack = [];
    let pageStatusTimer = null;

    const loginSection =
      document.getElementById("loginSection");

    const dashboard =
      document.getElementById("dashboard");

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        ch => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[ch])
      );
    }

    function formatNumber(value) {
      return Number(value ?? 0)
        .toLocaleString("en-US");
    }

    function showPageStatus(message, type = "success") {
      const box =
        document.getElementById("pageStatus");

      box.textContent = message;
      box.className =
        "page-status " + type;
      box.style.display = "block";

      if (pageStatusTimer) {
        clearTimeout(pageStatusTimer);
      }

      pageStatusTimer =
        setTimeout(() => {
          box.style.display = "none";
          box.textContent = "";
        }, 3000);
    }

    function showLoginError(message) {
      const box =
        document.getElementById("loginError");

      box.textContent = message;
      box.style.display = "block";
    }

    function clearLoginError() {
      const box =
        document.getElementById("loginError");

      box.textContent = "";
      box.style.display = "none";
    }

    function normalizeLoginAccount(raw) {
      const value =
        String(raw || "")
          .trim()
          .toLowerCase();

      if (value.includes("@")) {
        return value;
      }

      return value
        ? value + "@hawkvision.local"
        : "";
    }

    function showLogin() {
      loginSection.style.display = "block";
      dashboard.style.display = "none";
    }

    function showDashboard() {
      loginSection.style.display = "none";
      dashboard.style.display = "block";
    }

    async function getSessionToken() {
      const {
        data: { session },
        error
      } =
        await supabaseClient.auth.getSession();

      if (
        error ||
        !session?.access_token
      ) {
        throw new Error(
          "登入狀態已失效，請重新登入"
        );
      }

      return session.access_token;
    }

    function roleRank(role) {
      const idx =
        ROLE_ORDER.indexOf(role);

      return idx === -1
        ? 999
        : idx;
    }

    function allowedCreateRoles() {
      if (!currentAccount) return [];

      const actorRank =
        currentAccount.is_platform_owner
          ? 0
          : roleRank(
              currentAccount.business_role
            );

      return ROLE_ORDER
        .slice(actorRank + 1)
        .filter(role =>
          role !== "super_admin"
        );
    }

    function populateRoleOptions() {
      const select =
        document.getElementById("newRole");

      const roles =
        allowedCreateRoles();

      select.innerHTML =
        '<option value="">請選擇層級</option>' +
        roles.map(role =>
          `<option value="${role}">
            ${ROLE_LABELS[role] || role}
          </option>`
        ).join("");

      document.getElementById(
        "openCreateBtn"
      ).style.display =
        roles.length
          ? "inline-block"
          : "none";
    }

    function resetCreateForm() {
      document.getElementById(
        "newDisplayName"
      ).value = "";

      document.getElementById(
        "newAccount"
      ).value = "";

      document.getElementById(
        "newPassword"
      ).value = "";

      document.getElementById(
        "newRole"
      ).value = "";

      document.getElementById(
        "initialQuota"
      ).value = "0";

      document.getElementById(
        "initialQuotaWrap"
      ).style.display = "block";
    }

    function closeCreatePanel() {
      document.getElementById(
        "createPanel"
      ).style.display = "none";

      resetCreateForm();
    }

    function openCreatePanel() {
      resetCreateForm();
      document.getElementById(
        "createPanel"
      ).style.display = "block";
    }

    function renderBreadcrumb() {
      const box =
        document.getElementById(
          "breadcrumb"
        );

      box.innerHTML =
        contextStack.map(
          (item, index) => {
            const label =
              item.display_name ||
              item.account ||
              "未命名";

            return `
              <button
                type="button"
                data-index="${index}"
              >${escapeHtml(label)}</button>
              ${
                index <
                contextStack.length - 1
                  ? "<span>›</span>"
                  : ""
              }
            `;
          }
        ).join("");

      box.querySelectorAll(
        "button[data-index]"
      ).forEach(btn => {
        btn.addEventListener(
          "click",
          async () => {
            const index =
              Number(
                btn.dataset.index
              );

            contextStack =
              contextStack.slice(
                0,
                index + 1
              );

            await loadChildren(
              contextStack[
                contextStack.length - 1
              ]
            );
          }
        );
      });
    }

    function renderContextHeader() {
      const context =
        contextStack[
          contextStack.length - 1
        ];

      document.getElementById(
        "contextTitle"
      ).textContent =
        context
          ? `${context.display_name || context.account}｜${context.role_name || ROLE_LABELS[context.business_role] || ""}`
          : "—";

      document.getElementById(
        "backLevelBtn"
      ).style.display =
        contextStack.length > 1
          ? "inline-block"
          : "none";

      renderBreadcrumb();
    }

    function visibleChildren() {
      const q =
        document.getElementById(
          "accountSearch"
        ).value
          .trim()
          .toLowerCase();

      if (!q) return currentChildren;

      return currentChildren.filter(
        child =>
          [
            child.display_name,
            child.account,
            child.role_name,
            child.business_role
          ].some(
            value =>
              String(value || "")
                .toLowerCase()
                .includes(q)
          )
      );
    }

    function roleDisplay(child) {
      const base =
        child.role_name ||
        ROLE_LABELS[
          child.business_role
        ] ||
        child.business_role;

      return child.is_cross_level
        ? "直屬" + base
        : base;
    }

    function renderChildren() {
      const list =
        document.getElementById(
          "childList"
        );

      const rows =
        visibleChildren();

      document.getElementById(
        "accountCount"
      ).textContent =
        `顯示 ${rows.length} / ${currentChildren.length} 個下層`;

      if (!rows.length) {
        list.innerHTML =
          '<div class="empty">目前沒有符合的直屬下層</div>';
        return;
      }

      list.innerHTML =
        rows.map(child => {
          const isMember =
            child.business_role ===
            "member";

          const quotaAllowed =
            !isMember &&
            String(child.parent_id) ===
              String(currentUser.id);

          const canEnter =
            !isMember &&
            child.can_create_downline;

          return `
            <div
              class="child-row"
              data-user-id="${escapeHtml(child.user_id)}"
            >
              <div class="child-head">
                <div>
                  <div class="child-title">
                    ${escapeHtml(child.display_name || "未命名")}
                    <span class="role-badge ${child.is_cross_level ? "direct" : ""}">
                      ${escapeHtml(roleDisplay(child))}
                    </span>
                  </div>

                  <div class="child-account">
                    帳號：${escapeHtml(child.account || "—")}
                  </div>
                </div>

                <div class="child-actions">
                  ${
                    quotaAllowed
                      ? `<button class="soft quota-btn" type="button">額度管理</button>`
                      : ""
                  }

                  <button class="soft-amber permission-btn" type="button">
                    權限管理
                  </button>

                  <button class="soft-amber time-btn" type="button">
                    使用時間管理
                  </button>

                  <button class="soft-cyan name-btn" type="button">
                    修改名稱
                  </button>

                  <button class="soft password-btn" type="button">
                    修改密碼
                  </button>

                  ${
                    canEnter
                      ? `<button class="secondary enter-btn" type="button">查看下層 ›</button>`
                      : ""
                  }
                </div>
              </div>

              <div class="inline-host"></div>
            </div>
          `;
        }).join("");

      rows.forEach(child => {
        const row =
          list.querySelector(
            `.child-row[data-user-id="${CSS.escape(String(child.user_id))}"]`
          );

        if (!row) return;

        row.querySelector(
          ".quota-btn"
        )?.addEventListener(
          "click",
          () =>
            openQuotaPanel(
              row,
              child
            )
        );

        row.querySelector(
          ".permission-btn"
        ).addEventListener(
          "click",
          () =>
            openReservedPanel(
              row,
              "權限管理",
              "權限管理的位置已完成預留。權限項目尚未定稿，因此本版不先猜測實際權限開關。"
            )
        );

        row.querySelector(
          ".time-btn"
        ).addEventListener(
          "click",
          () =>
            openReservedPanel(
              row,
              "使用時間管理",
              "使用時間管理的位置已完成預留。開始時間、到期時間、星期與每日時段等規則待定稿後直接接在這裡。"
            )
        );

        row.querySelector(
          ".name-btn"
        ).addEventListener(
          "click",
          () =>
            openNamePanel(
              row,
              child
            )
        );

        row.querySelector(
          ".password-btn"
        ).addEventListener(
          "click",
          () =>
            openPasswordPanel(
              row,
              child
            )
        );

        row.querySelector(
          ".enter-btn"
        )?.addEventListener(
          "click",
          async () => {
            contextStack.push(child);
            await loadChildren(child);
          }
        );
      });
    }

    function hostFor(row) {
      document
        .querySelectorAll(
          ".inline-host"
        )
        .forEach(host => {
          host.innerHTML = "";
        });

    function openQuotaPanel(
      row,
      child
    ) {
      const host = hostFor(row);

      host.innerHTML = `
        <div class="inline-panel">
          <div class="muted">
            目前額度：
            <strong>${formatNumber(child.system_quota)}</strong>
          </div>

          <div class="inline-grid">
            <div>
              <label>額度數量</label>
              <input class="quota-amount" type="number" min="1" step="1" />
            </div>

            <div>
              <label>原因／備註（選填）</label>
              <input class="quota-reason" type="text" />
            </div>
          </div>

          <div class="panel-actions">
            <button class="secondary close-inline" type="button">
              取消
            </button>
            <button class="danger-soft reclaim-quota" type="button">
              收回額度
            </button>
            <button class="primary allocate-quota" type="button">
              分配額度
            </button>
          </div>
        </div>
      `;

      host.querySelector(
        ".close-inline"
      ).addEventListener(
        "click",
        () => {
          host.innerHTML = "";
        }
      );

      const run =
        async action => {
          const amount =
            Number(
              host.querySelector(
                ".quota-amount"
              ).value
            );

          const reason =
            host.querySelector(
              ".quota-reason"
            ).value.trim();

          if (
            !Number.isInteger(amount) ||
            amount <= 0
          ) {
            inlineStatus(
              row,
              "操作失敗：額度必須是大於 0 的整數",
              "error"
            );
            return;
          }

          const buttons =
            host.querySelectorAll(
              "button"
            );

          buttons.forEach(
            button =>
              button.disabled = true
          );

          try {
            const token =
              await getSessionToken();

            const endpoint =
              action === "allocate"
                ? "/allocate-quota"
                : "/reclaim-quota";

            const response =
              await fetch(
                HAWKVISION_ADMIN_API +
                endpoint,
                {
                  method: "POST",
                  headers: {
                    "Content-Type":
                      "application/json",
                    "Authorization":
                      "Bearer " + token
                  },
                  body: JSON.stringify({
                    target_user_id:
                      child.user_id,
                    amount,
                    reason
                  })
                }
              );

            const result =
              await response
                .json()
                .catch(() => ({}));

            if (
              !response.ok ||
              !result.ok
            ) {
              throw new Error(
                result.error ||
                "額度操作失敗"
              );
            }

            const r =
              result.result || {};

            child.system_quota =
              r.quota_after ??
              child.system_quota;

            renderChildren();

            const refreshedRow =
              document.querySelector(
                `.child-row[data-user-id="${CSS.escape(String(child.user_id))}"]`
              );

            if (refreshedRow) {
              inlineStatus(
                refreshedRow,
                `✓ ${
                  action === "allocate"
                    ? "額度分配"
                    : "額度收回"
                }成功`
              );
            }

            await refreshStats();
          } catch (error) {
            inlineStatus(
              row,
              "操作失敗：" +
              (
                error.message ||
                String(error)
              ),
              "error"
            );
          }
        };

      host.querySelector(
        ".allocate-quota"
      ).addEventListener(
        "click",
        () => run("allocate")
      );

      host.querySelector(
        ".reclaim-quota"
      ).addEventListener(
        "click",
        () => run("reclaim")
      );
    }

    async function loadDashboard(user) {
      currentUser = user;

      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "hv_admin_current_account"
        );

      if (error || !data) {
        await supabaseClient.auth.signOut();
        showLogin();
        showLoginError(
          "無法進入管理中心：" +
          (
            error?.message ||
            "找不到管理帳號資料"
          )
        );
        return;
      }

      currentAccount = data;

      document.getElementById(
        "currentName"
      ).textContent =
        currentAccount.display_name ||
        currentAccount.account ||
        "—";

      document.getElementById(
        "currentRole"
      ).textContent =
        "｜" +
        (
          currentAccount.role_name ||
          ROLE_LABELS[
            currentAccount.business_role
          ] ||
          ""
        );

      populateRoleOptions();
      await refreshStats();

      contextStack = [
        {
          ...currentAccount,
          role_name:
            currentAccount.role_name ||
            ROLE_LABELS[
              currentAccount.business_role
            ]
        }
      ];

      showDashboard();

      await loadChildren(

    async function login() {
      clearLoginError();

      const account =
        normalizeLoginAccount(
          document.getElementById(
            "loginAccount"
          ).value
        );

      const password =
        document.getElementById(
          "loginPassword"
        ).value;

      if (!account || !password) {
        showLoginError(
          "請輸入帳號與密碼"
        );
        return;
      }

      const button =
        document.getElementById(
          "loginBtn"
        );

      document.getElementById(
        "loginLoading"
      ).style.display = "block";

      button.disabled = true;

      try {
        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email: account,
              password
            });

        if (error) {
          throw error;
        }

        await loadDashboard(
          data.user
        );
      } catch (error) {
        showLoginError(
          "登入失敗：" +
          (
            error.message ||
            String(error)
          )
        );
      } finally {
        document.getElementById(
          "loginLoading"
        ).style.display = "none";

        button.disabled = false;
      }
    }

    async function createAccount() {
      const displayName =
        document.getElementById(
          "newDisplayName"
        ).value.trim();

      const account =
        document.getElementById(
          "newAccount"
        ).value.trim();

      const password =
        document.getElementById(
          "newPassword"
        ).value;

      const role =
        document.getElementById(
          "newRole"
        ).value;

      const initialQuota =
        role === "member"
          ? 0
          : Number(
              document.getElementById(
                "initialQuota"
              ).value || 0
            );

      if (
        !displayName ||
        !account ||
        !password ||
        !role
      ) {
        showPageStatus(
          "建立失敗：請完整填寫資料",
          "error"
        );
        return;
      }

      if (password.length < 8) {
        showPageStatus(
          "建立失敗：密碼至少需要 8 個字元",
          "error"
        );
        return;
      }

      if (
        !Number.isInteger(
          initialQuota
        ) ||
        initialQuota < 0
      ) {
        showPageStatus(
          "建立失敗：初始額度必須是 0 以上的整數",
          "error"
        );
        return;
      }

      const submit =
        document.getElementById(
          "submitCreateBtn"
        );

      const cancel =
        document.getElementById(
          "cancelCreateBtn"
        );

      submit.disabled = true;
      cancel.disabled = true;

      try {
        const token =
          await getSessionToken();

        const response =
          await fetch(
            HAWKVISION_ADMIN_API +
            "/create-account",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json",
                "Authorization":
                  "Bearer " + token
              },
              body: JSON.stringify({
                account,
                password,
                display_name:
                  displayName,
                business_role:
                  role,
                initial_quota:
                  initialQuota
              })
            }
          );

        const result =
          await response
            .json()
            .catch(() => ({}));

        if (
          !response.ok ||
          !result.ok
        ) {
          throw new Error(
            result.error ||
            "建立帳號失敗"
          );
        }

        closeCreatePanel();

        showPageStatus(
          role === "member"
            ? "✓ 會員帳號建立成功"
            : `✓ 帳號建立成功${
                initialQuota > 0
                  ? `，已分配額度 ${initialQuota}`
                  : ""
              }`
        );

        await refreshStats();

        await loadChildren(
          contextStack[0]
        );
      } catch (error) {
        showPageStatus(
          "建立失敗：" +
          (
            error.message ||
            String(error)
          ),
          "error"
        );
      } finally {
        submit.disabled = false;
        cancel.disabled = false;
      }
    }

      "click",
      async () => {
        if (
          contextStack.length <= 1
        ) {
          return;
        }

        contextStack.pop();

        await loadChildren(
          contextStack[
            contextStack.length - 1
          ]
        );
      }
    );

    async function restoreSession() {
      try {
        const {
          data: { session },
          error
        } =
          await supabaseClient.auth
            .getSession();

        if (
          error ||
          !session?.user
        ) {
          showLogin();
          return;
        }

        await loadDashboard(
          session.user
        );
      } catch {
        showLogin();
      }
    }

    restoreSession();
  </script>
</body>
</html>
