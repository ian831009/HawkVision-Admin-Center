<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HawkVision 管理中心</title>
<link rel="icon" type="image/png" href="favicon.png?v=1.8.2" />
<link rel="apple-touch-icon" href="hawkvision-app-icon.png?v=1.8.2" />
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#64748b;--line:#e5e7eb;
  --blue:#2563eb;--blueSoft:#eff6ff;--cyanSoft:#ecfeff;--violetSoft:#f5f3ff;
  --amberSoft:#fffbeb;--greenSoft:#f0fdf4;--red:#b91c1c;--redSoft:#fef2f2
}
body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(90deg,#111827,#172554);color:#fff;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}
header h1{margin:0;font-size:26px} header p{margin:7px 0 0;color:#cbd5e1;font-size:14px}
.version{background:#2563eb;padding:9px 15px;border-radius:999px;font-size:14px;white-space:nowrap}
main{max-width:1180px;margin:26px auto;padding:0 18px 44px}
.section,.login-card,.claim-card{background:#fff;border-radius:16px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.section{padding:20px;margin-bottom:20px}.login-card,.claim-card{max-width:540px;margin:0 auto;padding:24px}
h2,h3,h4{margin-top:0}
label{display:block;margin:12px 0 6px;font-weight:700;font-size:14px}
input,select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:#fff;color:var(--text)}
button{border:0;border-radius:10px;padding:10px 13px;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--blue);color:#fff}.secondary{background:#e5e7eb;color:#111827}
.soft{background:var(--blueSoft);color:#1d4ed8}.soft-cyan{background:var(--cyanSoft);color:#155e75}
.soft-violet{background:var(--violetSoft);color:#6d28d9}.soft-amber{background:var(--amberSoft);color:#92400e}
.soft-green{background:var(--greenSoft);color:#166534}.danger{background:var(--red);color:#fff}
.danger-soft{background:var(--redSoft);color:#991b1b}
#dashboard,#claimSection{display:none}
.login-card .primary,.claim-card>.primary{width:100%;margin-top:16px;padding:12px}
.top-user,.toolbar,.context-line,.manager-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.identity-name{font-size:18px;font-weight:800}.identity-role{color:var(--muted);margin-left:7px;font-size:14px}
.top-actions,.toolbar-right,.row-actions,.manager-menu,.nav-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#dbeafe;color:#1d4ed8}
.badge.disabled{background:#fee2e2;color:#991b1b}.badge.direct{background:#ede9fe;color:#6d28d9}
.panel{display:none;margin:14px 0;padding:16px;border:1px solid #dbeafe;background:#f8fbff;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.panel-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.toolbar input{max-width:320px}
.breadcrumb{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:12px 0;color:var(--muted);font-size:13px}
.breadcrumb button{background:transparent;color:var(--blue);padding:5px 7px}
.context-main{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.context-quota{display:flex;gap:8px;flex-wrap:wrap;color:#334155;font-size:13px}
.context-quota span{background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;padding:6px 9px}
.child-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px;background:#fff}
.child-row{padding:14px;border-bottom:1px solid var(--line);background:#fff}.child-row:last-child{border-bottom:0}
.child-row.disabled-account{background:#fffafa}
.child-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.child-title{font-weight:800;font-size:16px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.child-account{margin-top:4px;color:var(--muted);font-size:13px}
.account-manager{margin-top:12px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:12px;padding:14px}
.subpanel{margin-top:12px;padding:14px;border:1px solid #e2e8f0;background:#fff;border-radius:10px}
.readonly-note{margin:8px 0 0;color:#7c2d12;background:#fff7ed;padding:9px 10px;border-radius:8px;font-size:13px}
.quota-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.summary-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px}
.summary-box .small{font-size:12px;color:var(--muted)}.summary-box .big{font-size:21px;font-weight:800;margin-top:3px}
.danger-zone{margin-top:14px;padding-top:12px;border-top:1px solid #fecaca}
.disabled-divider{padding:11px 14px;background:#fff7f7;color:#991b1b;font-weight:800;font-size:13px;border-top:2px solid #ef4444;border-bottom:1px solid #fecaca}
.empty{padding:26px;text-align:center;color:var(--muted)}
.status{display:none;margin:10px 0;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:800}
.status.success{background:#dcfce7;color:#166534}.status.error{background:#fee2e2;color:#991b1b}
.muted{color:var(--muted);font-size:13px}.reserved{color:var(--muted);font-size:13px;line-height:1.6}
.password-wrap{display:flex;gap:6px;align-items:center}.password-wrap input{flex:1}.eye-btn{background:#eef2f7;color:#475569;min-width:44px;padding:10px}
.switch-line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.switch-line input{width:auto;transform:scale(1.2)}
@media(max-width:700px){
  header{flex-direction:column;align-items:flex-start;padding:18px}
  .grid,.quota-summary{grid-template-columns:1fr}.toolbar{align-items:stretch}.toolbar input{max-width:none}
  .section{padding:15px}.child-row{padding:12px}
  .row-actions button,.manager-menu button{flex:1 1 calc(50% - 8px)}
  .panel-actions button{flex:1 1 120px}
  .context-line{align-items:flex-start}.nav-actions{width:100%}.nav-actions button{flex:1}
}
</style>

<style>
.delete-rule-note{margin-top:10px;color:#991b1b;font-size:12px}
.hv-return-btn{
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 16px;
  border-radius:12px;
  background:#eef2f7;
  color:#334155;
  border:1px solid #cbd5e1;
  font-weight:800;
  box-shadow:0 2px 8px rgba(15,23,42,.08);
  transition:background .15s ease,border-color .15s ease,transform .15s ease;
}
.hv-return-btn:hover{background:#e2e8f0;border-color:#94a3b8}
.hv-return-btn:active{transform:translateY(1px)}
</style>
<style>
.audit-list{display:flex;flex-direction:column;gap:10px}
.audit-item{border:1px solid #e2e8f0;border-radius:12px;padding:12px;background:#fff}
.audit-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.audit-type{font-weight:800}
.audit-time{font-size:12px;color:#64748b}
.audit-target{font-size:13px;color:#475569;margin-top:4px}
.audit-detail{margin-top:10px;padding:10px;background:#f8fafc;border-radius:10px;font-size:12px;white-space:pre-wrap;word-break:break-word}
.weekday-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.weekday-grid label{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;border:1px solid #e2e8f0;border-radius:9px;margin:0;font-size:12px}
.weekday-grid input{width:auto}
.product-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #e5e7eb}
.product-row:last-child{border-bottom:0}
.product-row input{width:auto;transform:scale(1.2)}
@media(max-width:700px){
  .weekday-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>

<style>
.hv-toast{
  position:fixed;
  top:22px;
  right:22px;
  z-index:99999;
  max-width:min(430px,calc(100vw - 32px));
  padding:13px 16px;
  border-radius:12px;
  font-weight:800;
  box-shadow:0 12px 34px rgba(15,23,42,.20);
  border:1px solid transparent;
  display:none;
}
.hv-toast.success{background:#ecfdf5;color:#166534;border-color:#86efac}
.hv-toast.error{background:#fef2f2;color:#991b1b;border-color:#fca5a5}
@media(max-width:700px){
  .hv-toast{top:14px;left:16px;right:16px;max-width:none}
}
</style>

<style>
html,body{width:100%;max-width:100%;overflow-x:hidden}
*{box-sizing:border-box}
main,.dashboard,.card,.account-row,.manager-box,.subpanel,.toolbar,.topbar,.panel,.child-list{min-width:0;max-width:100%}
.top-actions,.toolbar-right,.row-actions,.manager-menu,.nav-actions{max-width:100%}
input,select,button,a{max-width:100%}
.audit-item,.audit-head,.audit-detail{min-width:0;max-width:100%;overflow-wrap:anywhere}
@media(max-width:700px){
  body{overflow-x:hidden}
  .topbar,.toolbar,.manager-title,.audit-head{width:100%;max-width:100%}
  .top-actions,.toolbar-right,.manager-menu,.nav-actions{width:100%;flex-wrap:wrap}
  .manager-menu>button,.manager-menu>a{flex:0 1 auto}
  .audit-head{align-items:flex-start}
}
</style>


<style>
.audit-floating-home{
  position:fixed;
  right:max(18px,env(safe-area-inset-right));
  bottom:max(22px,calc(env(safe-area-inset-bottom) + 18px));
  z-index:100000;
  border:0;
  border-radius:999px;
  padding:13px 18px;
  font-weight:900;
  background:#1d4ed8;
  color:#fff;
  box-shadow:0 10px 30px rgba(15,23,42,.28);
}
.audit-floating-home:active{transform:translateY(1px)}
@media(max-width:700px){
  .audit-floating-home{
    right:16px;
    bottom:max(18px,calc(env(safe-area-inset-bottom) + 14px));
    padding:12px 16px;
  }
}
</style>


<style id="hv-mobile-overflow-fix-v208">
html{
  width:100%;
  max-width:100%;
  overflow-x:clip;
}
body{
  width:100%;
  max-width:100%;
  overflow-x:clip;

header,main,#dashboard,.section,.child-list,.child-row,.child-head,
.account-manager,.manager-title,.manager-menu,.subpanel,.panel,
.toolbar,.toolbar-right,.top-user,.top-actions,.context-line,

  min-width:0 !important;

</style>


<style id="hv-mobile-final-v209">

}
body{

}

.child-head,.account-manager,.subpanel-host,.subpanel,.manager-menu,.danger-zone,

<style id="hv-audit-pagination-v210">
.audit-pagination{
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid #e2e8f0;
}
.audit-page-info{
  text-align:center;
  color:#64748b;
  font-size:12px;
  margin-bottom:10px;
}
.audit-page-actions{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
}
.audit-page-actions button{
  min-width:0;
  width:100%;
}
.audit-page-actions button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
@media(max-width:700px){
  .audit-page-actions{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
</style>


<style id="hv-audit-search-v211">
.audit-top-tools{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:14px;
}
.audit-search-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  gap:8px;
  width:100%;
}
.audit-search-row input{
  min-width:0;
  width:100%;
}
.audit-top-pagination,
.audit-bottom-pagination{
  margin-top:0;
  padding-top:0;
  border-top:0;
}

  margin-top:16px;
  padding-top:14px;
  border-top:1px solid #e2e8f0;
}
@media(max-width:700px){
  .audit-search-row{
    grid-template-columns:minmax(0,1fr) auto;
  }
  .audit-search-row .audit-close{
    grid-column:1 / -1;
    width:100%;
  }
}
</style>

</head>
<body>
<header>
  <div><h1>HawkVision 管理中心</h1><p>帳號、層級、額度與管理權限</p></div>
  <div class="version">Admin Center v2.1.1</div>
</header>

<main>
<section id="loginSection" class="login-card" style="display:none" aria-hidden="true">
  <h2>管理員登入</h2>
  <label for="loginAccount">帳號</label>
  <input id="loginAccount" type="text" autocomplete="username" placeholder="請輸入帳號" />
  <label for="loginPassword">密碼</label>
  <div class="password-wrap">
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="請輸入密碼" />
    <button class="eye-btn" type="button" data-toggle-password="#loginPassword">👁</button>
  </div>
  <div id="loginStatus" class="status error"></div>
  <button id="loginBtn" class="primary">登入管理中心</button>
</section>

<section id="claimSection">
  <div class="claim-card">
    <h2>首次登入安全設定</h2>
    <p class="muted">第一次登入必須設定只有你自己知道的新密碼。設定成功後會登出，請使用新密碼重新登入。</p>
    <label for="claimPassword1">新密碼</label>
    <div class="password-wrap">
      <input id="claimPassword1" type="password" autocomplete="new-password" placeholder="6–11字元，小寫英文＋至少五個數字" />
      <button class="eye-btn" type="button" data-toggle-password="#claimPassword1">👁</button>
    </div>
    <div class="hint">6–11字元，小寫英文＋至少五個數字</div>
    <label for="claimPassword2">再次輸入新密碼</label>
    <div class="password-wrap">
      <input id="claimPassword2" type="password" autocomplete="new-password" placeholder="再次輸入新密碼" />
      <button class="eye-btn" type="button" data-toggle-password="#claimPassword2">👁</button>
    </div>
    <div id="claimStatus" class="status"></div>
    <button id="claimBtn" class="primary">設定新密碼並重新登入</button>
  </div>
</section>

<section id="dashboard">
  <div class="section top-user">
    <div>
      <span id="currentName" class="identity-name">—</span>
      <span id="currentRole" class="identity-role">—</span>
      <span id="currentStatus" class="badge">啟用中</span>
    </div>
    <div class="top-actions">
      <button id="myNameBtn" class="soft-cyan" type="button" style="display:none">修改我的名稱</button>
      <button id="myPasswordBtn" class="soft" type="button">修改我的密碼</button>
      <button id="auditLogBtn" class="soft-violet" type="button">異動日誌</button>
      <a id="hawkvisionHomeBtn" class="secondary hv-return-btn" href="https://hawkvisionai.com/">返回</a><button id="logoutBtn" class="secondary" type="button">登出</button>
    </div>
  </div>

  <div id="selfPanel" class="section panel"></div>

  <div class="section">
    <div class="toolbar">
      <div class="search-wrap">
        <input id="accountSearch" type="search" placeholder="搜尋名稱或帳號" />
        <button id="accountSearchBtn" class="secondary" type="button">搜尋</button>
      </div>
      <div class="toolbar-right">
        <span id="accountCount" class="muted">—</span>
        <button id="openCreateBtn" class="primary" type="button">＋ 新增帳號</button>
      </div>
    </div>

    <div id="createPanel" class="panel">
      <h3>新增下屬帳號</h3>
      <div class="grid">
        <div><label for="newName">名稱</label><input id="newName" type="text" /></div>
        <div>
          <label for="newAccount">帳號</label>
          <input id="newAccount" type="text" placeholder="6–11字元，小寫英文＋至少五個數字" />
          <div class="hint">6–11字元，小寫英文＋至少五個數字</div>
        </div>
        <div>
          <label for="newPassword">初始密碼</label>
          <div class="password-wrap">
            <input id="newPassword" type="password" autocomplete="new-password" placeholder="6–11字元，小寫英文＋至少五個數字" />
            <button class="eye-btn" type="button" data-toggle-password="#newPassword">👁</button>
          </div>
          <div class="hint">6–11字元，小寫英文＋至少五個數字</div>
        </div>
        <div><label for="newRole">商業層級</label><select id="newRole"></select></div>
        <div id="initialQuotaWrap"><label for="initialQuota">初始額度</label><input id="initialQuota" type="number" min="0" step="1" value="0" /></div>
      </div>
      <div id="createStatus" class="status"></div>
      <div class="panel-actions">
        <button id="cancelCreateBtn" class="secondary" type="button">取消</button>
        <button id="createBtn" class="primary" type="button">建立帳號</button>
      </div>
    </div>

    <div id="pageStatus" class="status"></div>
    <div id="breadcrumb" class="breadcrumb"></div>

    <div class="context-line">
      <div>
        <div class="context-main">
          <span class="muted">目前查看：</span>

  const refresh_token=hash.get("hv_rt");
  if(access_token&&refresh_token){
    const {data,error}=await client.auth.setSession({access_token,refresh_token});
    history.replaceState(null,"",location.pathname+location.search);
    if(error)throw error;
    if(data?.user)hvSetActiveUser(data.user.id);
    return data?.session||null;

}

function translateError(message){
  const raw=String(message||"").trim();
  const m=raw.toLowerCase();
  if(!raw)return "操作失敗，請稍後再試";
  if(m.includes("foreign key constraint")||m.includes("violates foreign key"))return "帳號仍有歷史資料關聯，系統尚未完成刪除處理，請重新整理後再試";
  if(m.includes("invalid login credentials"))return "帳號或密碼錯誤";
  if(m.includes("user already registered")||m.includes("already been registered")||m.includes("duplicate key"))return "此帳號已經存在，請更換其他帳號";
  if(m.includes("email rate limit"))return "操作過於頻繁，請稍後再試";
  if(m.includes("failed to fetch")||m.includes("network")||m.includes("fetch failed"))return "目前無法連接伺服器，請稍後再試";
  if(m.includes("jwt")||m.includes("token")||m.includes("session"))return "登入狀態已失效，請重新登入";
  if(m.includes("permission")||m.includes("not authorized")||m.includes("row-level security"))return "你沒有執行此操作的權限";
  if(m.includes("timeout")||m.includes("statement timeout"))return "系統處理逾時，請稍後再試";
  if(/^[\x00-\x7F\s\W]+$/.test(raw))return "系統發生錯誤，請稍後再試";
  return raw;
}

              await api("/set-coadmin-platform-quota",{target_user_id:detail.user_id,enabled});
              detail.can_use_platform_quota=enabled;
            }
          }

          for(const input of host.querySelectorAll(".product-switch:not(:disabled)")){
            const key=input.dataset.key;
            const original=rows.find(x=>x.product_key===key);
            const enabled=input.checked===true;

            const {error:mutationError}=await supabaseClient.rpc("hv_set_user_product_access_v2",{
              p_target_user_id:detail.user_id,
              p_product_key:key,
              p_enabled:enabled
            });

            if(mutationError){
              const {data:verifyRows,error:verifyError}=await supabaseClient.rpc(
                "hv_admin_product_access_v2",
                {p_target_user_id:detail.user_id}
              );
              if(verifyError)throw mutationError;
              const verified=(Array.isArray(verifyRows)?verifyRows:[]).find(x=>x.product_key===key);
              if(!verified || Boolean(verified.is_enabled)!==enabled)throw mutationError;
            }

            original.is_enabled=enabled;
            changed.push({key,enabled});
          }

          localStatus(host,changed.length?"✓ 權限設定成功":"目前權限沒有變更","success");

            }
          }catch{}
        }
      });

  const {data:detail,error:detailError}=await supabaseClient.rpc("hv_admin_account_detail_v4",{p_target_user_id:ctx.user_id});

  const {data,error}=await supabaseClient.rpc("hv_admin_list_children_v3",{p_parent_user_id:ctx.user_id});

function formatAuditTime(v){
  if(!v)return "";
  try{return new Date(v).toLocaleString("zh-TW",{hour12:false})}catch{return String(v)}
}
function productLabel(key){
  const k=String(key||"");
  if(/record/i.test(k))return "記錄平台";
  if(/analysis/i.test(k))return "分析平台";
  if(/admin/i.test(k))return "管理中心";
  return k||"未指定";
}
function boolLabel(v){return v===true?"開啟":v===false?"關閉":"未設定"}
function dateTimeRange(d={}){
  const dates=(d.start_date||d.end_date)?`${d.start_date||"不限"} ～ ${d.end_date||"不限"}`:"不限日期";
  const times=(d.daily_start||d.daily_end)?`${String(d.daily_start||"不限").slice(0,5)} ～ ${String(d.daily_end||"不限").slice(0,5)}`:"不限時段";
  const days=Array.isArray(d.allowed_weekdays)?d.allowed_weekdays.map(x=>["","一","二","三","四","五","六","日"][Number(x)]||x).join("、"):"不限";
  return `${dates}｜週${days}｜${times}`;
}
function auditSummary(item){
  const n=item.new_data||{},o=item.old_data||{};
  switch(item.action_type){
    case "QUOTA_ALLOCATE": return `新增額度 ${fmt(n.amount||0)}；${fmt(o.quota_before||0)} → ${fmt(n.quota_after||0)}`;
    case "QUOTA_RECLAIM": return `收回額度 ${fmt(n.amount||0)}；${fmt(o.quota_before||0)} → ${fmt(n.quota_after||0)}`;
    case "PRODUCT_ACCESS_ENABLE": return `新增「${productLabel(n.product_key||o.product_key)}」權限`;
    case "PRODUCT_ACCESS_DISABLE": return `移除「${productLabel(n.product_key||o.product_key)}」權限`;
    case "DISPLAY_NAME_UPDATE": return `名稱：${o.target_display_name||"—"} → ${n.target_display_name||"—"}`;
    case "USAGE_TIME_UPDATE": return "使用時間設定已變更";
    case "COADMIN_PLATFORM_QUOTA_PERMISSION": return `共同管理員平台額度權限：${boolLabel(n.can_use_platform_quota)}`;
    case "ACCOUNT_CREATE": return `建立帳號：${n.target_display_name||n.target_account||"—"}`;
    case "ACCOUNT_DELETE":
    case "TAKEOVER_AND_DELETE_ACCOUNT": return `刪除帳號${Number(n.transferred_direct_children||0)>0?`；接手直屬 ${n.transferred_direct_children} 個`:""}`;
    case "ENABLE_DIRECT_ACCOUNT": case "ENABLE_DIRECT_BRANCH": case "ACCOUNT_ENABLE": return "啟用帳號";
    case "DISABLE_DIRECT_ACCOUNT": case "DISABLE_DIRECT_BRANCH": case "ACCOUNT_DISABLE": return "停用帳號";
    case "PASSWORD_RESET": return "重設下屬密碼";
    case "SELF_PASSWORD_UPDATE": case "PASSWORD_CLAIM": return "修改登入密碼";
    default:return item.reason||"";
  }
}
function auditDetailText(item){
  const n=item.new_data||{},o=item.old_data||{};
  switch(item.action_type){
    case "PRODUCT_ACCESS_ENABLE": return `新增權限：${productLabel(n.product_key||o.product_key)}`;
    case "PRODUCT_ACCESS_DISABLE": return `移除權限：${productLabel(n.product_key||o.product_key)}`;
    case "USAGE_TIME_UPDATE": return `修改前：${dateTimeRange(o)}\n修改後：${dateTimeRange(n)}`;
    case "QUOTA_ALLOCATE": return `異動：新增 ${fmt(n.amount||0)} 額度\n原本額度：${fmt(o.quota_before||0)}\n異動後：${fmt(n.quota_after||0)}`;
    case "QUOTA_RECLAIM": return `異動：收回 ${fmt(n.amount||0)} 額度\n原本額度：${fmt(o.quota_before||0)}\n異動後：${fmt(n.quota_after||0)}`;
    case "DISPLAY_NAME_UPDATE": return `原本名稱：${o.target_display_name||"—"}\n修改後名稱：${n.target_display_name||"—"}`;
    case "COADMIN_PLATFORM_QUOTA_PERMISSION": return `平台額度權限：${boolLabel(n.can_use_platform_quota)}`;
    case "ACCOUNT_CREATE": return `建立帳號：${n.target_display_name||n.target_account||"—"}\n角色：${n.business_role||"—"}${n.initial_quota!=null?`\n初始額度：${fmt(n.initial_quota)}`:""}`;
    case "ACCOUNT_DELETE": case "TAKEOVER_AND_DELETE_ACCOUNT": return `刪除帳號：${o.target_display_name||o.target_account||"—"}${Number(n.transferred_direct_children||0)>0?`\n接手直屬下屬：${n.transferred_direct_children} 個`:""}`;
    default:return auditSummary(item)||"此異動沒有其他詳細內容";

}

async function openAuditLogs(page=1,options={}){
  closeAllPanels();
  const panel=document.getElementById("selfPanel");
  panel.style.display="block";

  if(options.resetSearch===true){
    auditSearchQuery="";
  }

  panel.innerHTML='<div class="empty">載入中…</div>';

  try{
    const requestedPage=Math.max(1,Number(page)||1);
    const offset=(requestedPage-1)*AUDIT_PAGE_SIZE;

    const {data,error}=await supabaseClient.rpc(
      "hv_my_admin_audit_logs_v3",
      {
        p_limit:AUDIT_PAGE_SIZE,
        p_offset:offset,
        p_search:auditSearchQuery||null
      }
    );
    if(error)throw error;

    const rows=Array.isArray(data?.items)?data.items:[];
    const total=Number(data?.total_count||0);
    const lastPage=Math.max(1,Math.ceil(total/AUDIT_PAGE_SIZE));
    auditCurrentPage=Math.min(requestedPage,lastPage);

    if(auditCurrentPage!==requestedPage){
      return openAuditLogs(auditCurrentPage);
    }

    panel.innerHTML=`<div class="audit-top-tools">
        <div class="audit-search-row">
          <input class="audit-search-input" type="search" placeholder="可搜尋帳號、名稱擇一" value="${escapeHtml(auditSearchQuery)}">
          <button class="primary audit-search-btn" type="button">搜尋</button>
          <button class="secondary audit-close" type="button">關閉</button>
        </div>
        ${auditPaginationHtml(auditCurrentPage,lastPage,total,"top")}
      </div>
      <button class="audit-floating-home" type="button">回到最上方</button>
      <div class="audit-list">${rows.map(item=>`<div class="audit-item">
        <div class="audit-head"><div><div class="audit-type">${escapeHtml(AUDIT_LABELS[item.action_type]||item.action_type)}</div><div class="audit-target">${escapeHtml(item.target_display_name||item.target_account||"—")}</div></div><div class="audit-time">${escapeHtml(formatAuditTime(item.created_at))}</div></div>
        ${item.has_detail?`<button class="secondary audit-detail-btn" type="button" style="margin-top:8px">查看詳細</button><div class="audit-detail" style="display:none">${escapeHtml(auditDetailText(item))}</div>`:""}
      </div>`).join("")||'<div class="empty">沒有符合條件的異動紀錄</div>'}</div>
      ${auditPaginationHtml(auditCurrentPage,lastPage,total,"bottom")}`;

    panel.querySelector(".audit-close").addEventListener("click",()=>{
      panel.style.display="none";
      panel.innerHTML="";
      auditSearchQuery="";
      auditCurrentPage=1;
    });

    const searchInput=panel.querySelector(".audit-search-input");
    panel.querySelector(".audit-search-btn").addEventListener("click",()=>{
      auditSearchQuery=searchInput.value.trim();
      openAuditLogs(1);
    });

    // 輸入文字不會自動搜尋；Enter 等同按「搜尋」。
    searchInput.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        auditSearchQuery=searchInput.value.trim();
        openAuditLogs(1);
      }
    });

    panel.querySelector(".audit-floating-home").addEventListener("click",()=>{
      const top=Math.max(panel.getBoundingClientRect().top+window.scrollY-12,0);
      window.scrollTo({top,behavior:"smooth"});
    });

    panel.querySelectorAll(".audit-first").forEach(btn=>btn.addEventListener("click",()=>openAuditLogs(1)));
    panel.querySelectorAll(".audit-prev").forEach(btn=>btn.addEventListener("click",()=>openAuditLogs(auditCurrentPage-1)));
    panel.querySelectorAll(".audit-next").forEach(btn=>btn.addEventListener("click",()=>openAuditLogs(auditCurrentPage+1)));
    panel.querySelectorAll(".audit-last").forEach(btn=>btn.addEventListener("click",()=>openAuditLogs(lastPage)));

    panel.querySelectorAll(".audit-detail-btn").forEach(btn=>btn.addEventListener("click",()=>{
      const detail=btn.nextElementSibling;
      const open=detail.style.display!=="none";
      detail.style.display=open?"none":"block";
      btn.textContent=open?"查看詳細":"收起詳細";
    }));
  }catch(e){
    panel.innerHTML=`<div class="local-status status"></div>`;
    localStatus(panel,e.message||e,"error");
  }
}

function openSelfName(){
  if(!currentSelf?.is_platform_owner){
    notify("只有最高管理員可以修改自己的名稱","error");
    return;
  }
  closeAllPanels();
  const panel=document.getElementById("selfPanel");
  panel.style.display="block";
  panel.innerHTML=`<h3>修改我的名稱</h3>
    <div><label>新名稱</label><input class="self-name" maxlength="50" value="${escapeHtml(currentSelf.display_name||"")}"></div>
    <div class="local-status status"></div>
    <div class="panel-actions"><button class="primary save-self-name" type="button">儲存名稱</button></div>`;
  panel.querySelector(".save-self-name").addEventListener("click",async()=>{
    const value=panel.querySelector(".self-name").value.trim();
    if(!value){localStatus(panel,"名稱不能空白");return}
    try{
      await api("/update-display-name",{target_user_id:currentUser.id,display_name:value});
      currentSelf.display_name=value;
      document.getElementById("currentName").textContent=value;
      localStatus(panel,"✓ 名稱修改成功","success");
    }catch(err){
      try{
        const {data:fresh}=await supabaseClient.rpc("hv_admin_current_account");
        if(fresh && String(fresh.display_name||"").trim()===value){
          currentSelf.display_name=value;
          document.getElementById("currentName").textContent=value;
          localStatus(panel,"✓ 名稱修改成功","success");
        }else{
          localStatus(panel,translateError(err.message));
        }
      }catch{
        localStatus(panel,translateError(err.message));
      }
    }
  });
}

function openSelfPassword(){
  closeAllPanels();const panel=document.getElementById("selfPanel");panel.style.display="block";
  panel.innerHTML=`<h3>修改我的密碼</h3><div class="hint">6–11字元，小寫英文＋至少五個數字</div><div class="grid">
    <div><label>新密碼</label><div class="password-wrap"><input id="selfP1" class="sp1" type="password" autocomplete="new-password"><button class="eye-btn" type="button" data-toggle-password="#selfP1">👁</button></div></div>
    <div><label>再次輸入</label><div class="password-wrap"><input id="selfP2" class="sp2" type="password" autocomplete="new-password"><button class="eye-btn" type="button" data-toggle-password="#selfP2">👁</button></div></div>
    </div><div class="local-status status"></div><div class="panel-actions"><button class="secondary self-cancel" type="button">取消</button><button class="primary self-save" type="button">確認修改</button></div>`;
  bindPasswordToggles(panel);
  panel.querySelector(".self-cancel").addEventListener("click",()=>{panel.style.display="none";panel.innerHTML=""});
  panel.querySelector(".self-save").addEventListener("click",async()=>{
    const p1=panel.querySelector(".sp1").value,p2=panel.querySelector(".sp2").value;
    try{
      validateAccountLike(p1,"密碼");
      if(p1!==p2)throw new Error("兩次輸入的密碼不一致");
      await api("/reset-password",{target_user_id:currentUser.id,new_password:p1});
      localStatus(panel,"✓ 密碼修改成功，3 秒後請重新登入","success");
      setTimeout(async()=>{await supabaseClient.auth.signOut();showOnly("login")},3000);
    }catch(e){localStatus(panel,"修改失敗："+translateError(e.message))}
  });
}

document.getElementById("loginBtn").addEventListener("click",login);
document.getElementById("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
document.getElementById("claimBtn").addEventListener("click",claimPassword);
document.getElementById("logoutBtn").addEventListener("click",async()=>{
  if(sessionWatch)clearInterval(sessionWatch);
  try{await supabaseClient.auth.signOut({scope:"global"})}catch{}
  try{await supabaseClient.auth.signOut({scope:"local"})}catch{}
  hvClearActiveUser();
  currentUser=null;currentSelf=null;currentChildren=[];contextStack=[];
  window.location.replace("https://hawkvisionai.com/?logout=1");
});

document.getElementById("myNameBtn").addEventListener("click",openSelfName);
document.getElementById("myPasswordBtn").addEventListener("click",openSelfPassword);
document.getElementById("auditLogBtn").addEventListener("click",()=>{auditCurrentPage=1;auditSearchQuery="";openAuditLogs(1)});
document.getElementById("openCreateBtn").addEventListener("click",()=>{clearAccountSearch();
  document.getElementById("selfPanel").style.display="none";document.getElementById("selfPanel").innerHTML="";document.querySelectorAll(".account-manager").forEach(x=>x.remove());resetCreateForm();document.getElementById("createPanel").style.display="block";
});
document.getElementById("cancelCreateBtn").addEventListener("click",()=>{document.getElementById("createPanel").style.display="none";resetCreateForm()});
document.getElementById("createBtn").addEventListener("click",createAccount);
document.getElementById("newRole").addEventListener("change",e=>{
  const noQuota=["member","co_admin"].includes(e.target.value);document.getElementById("initialQuotaWrap").style.display=noQuota?"none":"block";if(noQuota)document.getElementById("initialQuota").value="0";
});
document.getElementById("accountSearchBtn").addEventListener("click",()=>{
  appliedSearch=document.getElementById("accountSearch").value.trim();
  renderChildren();
});
document.getElementById("accountSearch").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    appliedSearch=e.currentTarget.value.trim();
    renderChildren();
  }
});
document.getElementById("backBtn").addEventListener("click",async()=>{if(contextStack.length<=1)return;clearAccountSearch();closeAllPanels();contextStack.pop();await loadContext(false)});
document.getElementById("homeBtn").addEventListener("click",async()=>{if(contextStack.length<=1)return;clearAccountSearch();closeAllPanels();contextStack=contextStack.slice(0,1);await loadContext(false)});

async function restore(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session?.user){window.location.replace("https://hawkvisionai.com/");return}
  currentUser=session.user;
  try{await loadDashboard()}
  catch(e){await supabaseClient.auth.signOut();showOnly("login");setStatus(document.getElementById("loginStatus"),"無法進入管理中心："+translateError(e.message),"error",true)}
}
(async()=>{
  await hvAcceptSso(supabaseClient).catch(()=>{});
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session || !(await hvValidateActiveIdentity(supabaseClient,session))){
    window.location.replace("https://hawkvisionai.com/");
    return;
  }
  currentUser=session.user;
  try{await loadDashboard()}
  catch(e){await supabaseClient.auth.signOut({scope:"local"}).catch(()=>{});window.location.replace("https://hawkvisionai.com/")}
})();
</script>
