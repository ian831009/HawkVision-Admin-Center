<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>HawkVision Stress Lab v1.0.0</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
h1{font-size:22px;margin:0 0 6px}.ver{font-size:13px;color:#6b7280}.hint{font-size:13px;color:#6b7280;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
label{display:block;font-size:13px;margin-bottom:6px;color:#374151}
input,select,button{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;font-size:15px;background:#fff}
button{cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff}.danger{background:#fff;color:#b91c1c;border-color:#fecaca}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{width:auto;min-width:150px}
.status{display:none;margin-top:12px;padding:10px;border-radius:10px;font-size:14px}.ok{display:block;background:#ecfdf5;color:#065f46}.err{display:block;background:#fef2f2;color:#991b1b}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.metric{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee}
.pass{color:#047857;font-weight:700}.warn{color:#b45309;font-weight:700}.fail{color:#b91c1c;font-weight:700}
@media(max-width:720px){.grid,.metrics{grid-template-columns:1fr}.wrap{padding:12px}.actions button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>HawkVision Stress Lab</h1>
    <div class="ver">v1.0.0｜獨立壓力測試工具，不寫入正式帳號資料</div>
    <p class="hint">測試資料只存在 <code>hv_stress_*</code> 專用資料表。只有最高管理員可以建立、測試與刪除。三個等級：511、2,047、8,191 個節點。</p>
  </div>

  <div class="card" id="loginCard">
    <div class="grid">
      <div><label>最高管理員帳號</label><input id="account" autocomplete="username"></div>
      <div><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div>
    </div>
    <div class="actions" style="margin-top:12px"><button class="primary" id="loginBtn">登入壓力測試</button></div>
    <div id="loginStatus" class="status"></div>
  </div>

  <div class="card" id="toolCard" style="display:none">
    <div class="grid">
      <div>
        <label>測試等級</label>
        <select id="scale">
          <option value="511">Level 1｜511 nodes + 5,110 logs</option>
          <option value="2047">Level 2｜2,047 nodes + 20,470 logs</option>
          <option value="8191">Level 3｜8,191 nodes + 81,910 logs</option>
        </select>
      </div>
      <div>
        <label>重複測試次數</label>
        <select id="repeat">
          <option value="10">10 次</option>
          <option value="20" selected>20 次</option>
          <option value="50">50 次</option>
        </select>
      </div>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="primary" id="createRunBtn">建立測試資料</button>
      <button id="runBenchBtn">執行效能測試</button>
      <button class="danger" id="cleanupBtn">刪除此測試資料</button>
    </div>
    <div id="toolStatus" class="status"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h1 style="font-size:18px">測試結果</h1>
    <div id="runInfo" class="hint"></div>
    <div class="metrics">
      <div class="metric">節點數<b id="nodeCount">—</b></div>
      <div class="metric">Audit 數<b id="auditCount">—</b></div>
      <div class="metric">整樹深度<b id="treeDepth">—</b></div>
      <div class="metric">建立資料耗時<b id="createMs">—</b></div>
    </div>
    <table>
      <thead><tr><th>項目</th><th>p50</th><th>p95</th><th>最大</th><th>判定</th></tr></thead>
      <tbody id="resultBody"></tbody>
    </table>
    <p class="hint">建議判定：p95 ≤ 300ms = 通過；300–800ms = 注意；&gt;800ms = 需優化。這是 RPC 往返時間，包含瀏覽器→Supabase 網路延遲。</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const VERSION="1.0.0";
const SUPABASE_URL="https://rwxujvpakpemiwkitltk.supabase.co";
const SUPABASE_KEY="sb_publishable_aN_1_fzAV3hR6FmW7FTZGg_6SF0MUHF";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentRun=null;

const $=id=>document.getElementById(id);
function showStatus(el,msg,ok=true){el.textContent=msg;el.className="status "+(ok?"ok":"err")}
function emailFor(account){const v=account.trim();return v.includes("@")?v.toLowerCase():v+"@hawkvision.local"}
function pct(arr,p){if(!arr.length)return 0;const a=[...arr].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.floor((a.length-1)*p))]}
function verdict(ms){return ms<=300?["通過","pass"]:ms<=800?["注意","warn"]:["需優化","fail"]}
async function rpc(name,args={}){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
async function timed(fn){const a=performance.now();const value=await fn();return {ms:performance.now()-a,value}}
async function repeats(n,fn){const out=[];for(let i=0;i<n;i++){const r=await timed(fn);out.push(r.ms)}return out}
function addResult(name,arr){
  const p50=pct(arr,.50),p95=pct(arr,.95),max=Math.max(...arr),[text,cls]=verdict(p95);
  $("resultBody").insertAdjacentHTML("beforeend",`<tr><td>${name}</td><td>${p50.toFixed(0)} ms</td><td>${p95.toFixed(0)} ms</td><td>${max.toFixed(0)} ms</td><td class="${cls}">${text}</td></tr>`);
}

$("loginBtn").onclick=async()=>{
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:emailFor($("account").value),password:$("password").value});
    if(error)throw error;
    const owner=await rpc("hv_is_platform_owner",{p_user_id:data.user.id});
    if(owner!==true){await sb.auth.signOut();throw new Error("只有最高管理員可以使用壓力測試工具")}
    $("loginCard").style.display="none";$("toolCard").style.display="block";
  }catch(e){showStatus($("loginStatus"),e.message||String(e),false)}
};

$("createRunBtn").onclick=async()=>{
  try{
    showStatus($("toolStatus"),"正在建立壓力測試資料，請勿關閉頁面…",true);
    const scale=Number($("scale").value);
    const r=await timed(()=>rpc("hv_stress_create_run_v1",{p_scale:scale}));
    currentRun=r.value;
    $("resultCard").style.display="block";
    $("nodeCount").textContent=currentRun.node_count.toLocaleString();
    $("auditCount").textContent=currentRun.audit_count.toLocaleString();
    $("createMs").textContent=Math.round(r.ms)+" ms";
    $("runInfo").textContent=`Run ID：${currentRun.run_id}｜Level：${currentRun.scale}`;
    showStatus($("toolStatus"),`建立完成：${currentRun.node_count.toLocaleString()} nodes / ${currentRun.audit_count.toLocaleString()} logs`,true);
  }catch(e){showStatus($("toolStatus"),e.message||String(e),false)}
};

$("runBenchBtn").onclick=async()=>{
  if(!currentRun){showStatus($("toolStatus"),"請先建立測試資料",false);return}
  try{
    showStatus($("toolStatus"),"效能測試執行中…",true);
    $("resultBody").innerHTML="";
    const n=Number($("repeat").value);
    const runId=currentRun.run_id;

    const tree=await timed(()=>rpc("hv_stress_tree_stats_v1",{p_run_id:runId}));
    $("treeDepth").textContent=tree.value.max_depth;

    // root children
    const rootResp=await rpc("hv_stress_list_children_v1",{p_run_id:runId,p_parent_id:null,p_limit:10,p_offset:0});
    const rootId=rootResp.rows?.[0]?.id;
    const direct=await repeats(n,()=>rpc("hv_stress_list_children_v1",{p_run_id:runId,p_parent_id:rootId,p_limit:100,p_offset:0}));
    addResult("直屬下屬清單",direct);

    const search=await repeats(n,()=>rpc("hv_stress_search_v1",{p_run_id:runId,p_query:"測試",p_limit:20}));
    addResult("名稱/帳號搜尋",search);

    const treeTimes=await repeats(n,()=>rpc("hv_stress_tree_stats_v1",{p_run_id:runId}));
    addResult("整棵樹遞迴統計",treeTimes);

    const auditFirst=await repeats(n,()=>rpc("hv_stress_audit_page_v1",{p_run_id:runId,p_page:1,p_page_size:20}));
    addResult("Audit 第一頁 20 筆",auditFirst);

    const lastPage=Math.max(1,Math.ceil(currentRun.audit_count/20));
    const auditLast=await repeats(n,()=>rpc("hv_stress_audit_page_v1",{p_run_id:runId,p_page:lastPage,p_page_size:20}));
    addResult("Audit 最後一頁 20 筆",auditLast);

    showStatus($("toolStatus"),"效能測試完成",true);
  }catch(e){showStatus($("toolStatus"),e.message||String(e),false)}
};

$("cleanupBtn").onclick=async()=>{
  if(!currentRun){showStatus($("toolStatus"),"目前沒有可刪除的測試資料",false);return}
  if(!confirm(`確定刪除 Level ${currentRun.scale} 的全部壓力測試資料？`))return;
  try{
    await rpc("hv_stress_cleanup_run_v1",{p_run_id:currentRun.run_id});
    showStatus($("toolStatus"),"壓力測試資料已全部刪除",true);
    currentRun=null;$("resultCard").style.display="none";
  }catch(e){showStatus($("toolStatus"),e.message||String(e),false)}
};
</script>
</body>
</html>
